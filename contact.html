<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="icon" href="IMG/favicon.ico" type="image/png">
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        text-align: center; /* centreren van alle tekst */
      }

      nav {
        background-color: black;
        padding: 10px 0;
      }

      .navbar {
        display: flex;
        justify-content: center;
        gap: 20px;
        position: sticky;
        top: 0;
      }

      .navbar a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.3s;
      }

      .navbar a:hover {
        color: limegreen;
      }

      form {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background-color: limegreen;
        border-radius: 10px;
        color: #333
      }

      form label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }

      form input[type="text"],
      form input[type="email"],
      from textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1em;
        margin-bottom: 20px;
        transition: border-color 0.3s ease;
      }

      form input:focus,
      form textarea:focus {
        border-color: #2980b9;
        outline: none;
      }

      form button {
        background-color: #2980b9;
        color: white;
        padding: 12px 24px;
        font-size: 1em;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3 ease;
      }

      form button:hover {
        background-color: #1f6390;
      }
    </style>
  </head>
  <body>
     <nav>
      <a href="index.html">Startpagina</a>
      <a href="hobbys.html">Hobby's</a>
      <a href="ervaring.html">Ervaring</a>
      <a href="curriculum Vitae.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>

    <h1>Contact</h1>
    <p>U kan mij bereiken via onderstaande manieren:</p>

    <h2>Email</h2>
    <p>nielsdeckx@gmail.com</p>

    <h2>Vul het formulier in om contact op te nemen</h2>

    <form>
      <label for="voornaam">Voornaam:</label><br />
      <input type="text" id="voornaam" name="voornaam" required /><br /><br />

      <label for="achternaam">Achternaam:</label><br />
      <input
        type="text"
        id="achternaam"
        name="achternaam"
        required
      /><br /><br />

      <label for="email">E-mailadres:</label><br />
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="onderwerp">Onderwerp:</label><br />
      <input type="text" id="onderwerp" name="onderwerp" required /><br /><br />

      <label for="vraag">Uw vraag:</label><br />
      <textarea
        id="vraag"
        name="vraag"
        rows="5"
        cols="40"
        placeholder="Typ hier uw vraag..."
        required
      ></textarea
      ><br /><br />

      <button type="submit">Verzenden</button>
    </form>
  </body>
</html>
